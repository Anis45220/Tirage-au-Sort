<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirage au Sort — Les Bâtonnets de la Classe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --wood-light: #fef08a;
      --wood: #facc15;
      --wood-dark: #ca8a04;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e293b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Fredoka', cursive;
      font-size: 2.6rem;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      margin-top: 4px;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 28px;
      max-width: 1200px;
      width: 100%;
      height: calc(100vh - 150px);
      min-height: 580px;
    }

    /* SCÈNE DU BOCAL ET DU TIRAGE */
    .stage-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 32px;
      position: relative;
      overflow: hidden;
    }

    .canvas-container {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Le Bâtonnet Vedette */
    .drawn-stick-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      pointer-events: none;
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 20;
    }

    .drawn-stick-wrapper.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .giant-stick {
      width: 440px;
      height: 90px;
      background: linear-gradient(180deg, #fef08a 0%, #fde047 30%, #eab308 100%);
      border-radius: 45px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.8), inset 0 -4px 6px rgba(161, 98, 7, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #ca8a04;
      transform: rotate(-3deg);
      animation: floatStick 3s ease-in-out infinite alternate;
    }

    @keyframes floatStick {
      0% { transform: rotate(-3deg) translateY(0px); }
      100% { transform: rotate(-1deg) translateY(-8px); }
    }

    .giant-stick span {
      font-family: 'Fredoka', cursive;
      font-size: 2.6rem;
      font-weight: 700;
      color: #713f12;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.4);
      letter-spacing: 1px;
    }

    /* Le Pot de Bâtonnets Stylisé */
    .jar {
      width: 220px;
      height: 250px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top: none;
      border-radius: 0 0 35px 35px;
      position: relative;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4), inset 0 0 20px rgba(255,255,255,0.1);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 20px;
    }

    .jar-rim {
      position: absolute;
      top: -12px;
      left: -8px;
      right: -8px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
    }

    .jar-sticks {
      position: absolute;
      top: -70px;
      width: 180px;
      height: 280px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: visible;
      pointer-events: none;
    }

    .mini-stick {
      position: absolute;
      width: 14px;
      height: 200px;
      background: linear-gradient(180deg, #fef08a, #eab308);
      border-radius: 8px;
      border: 1px solid #ca8a04;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transform-origin: bottom center;
      transition: all 0.3s ease;
    }

    /* Boutons et Contrôles */
    .actions {
      display: flex;
      gap: 16px;
      z-index: 10;
    }

    .btn-draw {
      font-family: 'Fredoka', cursive;
      font-size: 1.5rem;
      font-weight: 600;
      color: #0f172a;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border: none;
      padding: 16px 40px;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-draw:hover {
      transform: scale(1.05) translateY(-2px);
      box-shadow: 0 15px 30px rgba(56, 189, 248, 0.6);
    }

    .btn-draw:active {
      transform: scale(0.98);
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 9999px;
      padding: 0 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-reset:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    /* PANNEAU LATÉRAL (ÉLÈVES) */
    .sidebar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .badge {
      background: #334155;
      color: #38bdf8;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    .student-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding-right: 6px;
    }

    .student-list::-webkit-scrollbar {
      width: 6px;
    }
    .student-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    .student-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      margin-bottom: 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .student-item:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .student-item.picked {
      opacity: 0.4;
      text-decoration: line-through;
      background: transparent;
    }

    .student-item.absent {
      opacity: 0.3;
      border-color: rgba(239, 68, 68, 0.3);
    }

    .student-name {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .btn-toggle-absent {
      background: none;
      border: none;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
    }

    .btn-toggle-absent:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }

    /* CANVAS CONFETTIS */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <header>
    <h1>Le Pot Magique</h1>
    <div class="subtitle">Tirage aléatoire équitable pour la classe</div>
  </header>

  <div class="main-layout">
    <!-- ZONE DU TIRAGE -->
    <div class="stage-card">
      <div class="canvas-container">
        
        <!-- Bâtonnet tiré au sort -->
        <div class="drawn-stick-wrapper" id="drawnStickWrapper">
          <div class="giant-stick">
            <span id="drawnName">Prénom</span>
          </div>
        </div>

        <!-- Le bocal contenant les bâtons restants -->
        <div class="jar" id="jar">
          <div class="jar-rim"></div>
          <div class="jar-sticks" id="jarSticks"></div>
        </div>

      </div>

      <div class="actions">
        <button class="btn-draw" id="btnDraw" onclick="tirerUnBatonnet()">Tirer un bâtonnet ✨</button>
        <button class="btn-reset" onclick="reinitialiserTirage()">Recommencer le pot</button>
      </div>
    </div>

    <!-- LISTE DES ÉLÈVES -->
    <div class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Élèves</span>
        <span class="badge" id="counterBadge">0 restant</span>
      </div>
      <ul class="student-list" id="studentList"></ul>
    </div>
  </div>

  <canvas id="confettiCanvas"></canvas>

  <script>
    const INITIAL_STUDENTS = [
      "Salmi", "Julia", "Younouss", "Bilal", "Zayd", "Fodil", 
      "Younes", "Mardochée", "Jahely", "Aymen", "Oliveroise Paule", 
      "Salim", "Liam", "Kailyne", "Assia", "Hafsia", "Ines", 
      "Abdoulaye", "Eunice", "Mamadou Yaya", "Omar", "Melchior", "Khadidja"
    ];

    let students = [];

    function init() {
      const saved = localStorage.getItem("classe_batonnets");
      if (saved) {
        students = JSON.parse(saved);
      } else {
        students = INITIAL_STUDENTS.map(name => ({
          name: name,
          picked: false,
          absent: false
        }));
        save();
      }
      render();
    }

    function save() {
      localStorage.setItem("classe_batonnets", JSON.stringify(students));
    }

    function render() {
      const listEl = document.getElementById("studentList");
      const jarEl = document.getElementById("jarSticks");
      listEl.innerHTML = "";
      jarEl.innerHTML = "";

      const available = students.filter(s => !s.picked && !s.absent);
      document.getElementById("counterBadge").innerText = `${available.length} restant${available.length > 1 ? 's' : ''}`;

      // Rendu de la liste
      students.forEach((s, idx) => {
        const li = document.createElement("li");
        li.className = `student-item ${s.picked ? 'picked' : ''} ${s.absent ? 'absent' : ''}`;
        li.innerHTML = `
          <span class="student-name">${s.name}</span>
          <button class="btn-toggle-absent" onclick="toggleAbsent(${idx})">
            ${s.absent ? 'Présent' : 'Absent'}
          </button>
        `;
        listEl.appendChild(li);
      });

      // Rendu des bâtonnets dans le pot
      available.forEach((_, i) => {
        const stick = document.createElement("div");
        stick.className = "mini-stick";
        const angle = -25 + (i * (50 / Math.max(available.length - 1, 1))) + (Math.random() * 6 - 3);
        const offsetX = (i - available.length / 2) * 5;
        stick.style.transform = `translateX(${offsetX}px) rotate(${angle}deg)`;
        stick.style.height = `${170 + Math.random() * 30}px`;
        jarEl.appendChild(stick);
      });
    }

    function toggleAbsent(idx) {
      students[idx].absent = !students[idx].absent;
      save();
      render();
    }

    function reinitialiserTirage() {
      students.forEach(s => s.picked = false);
      save();
      render();
      document.getElementById("drawnStickWrapper").classList.remove("active");
    }

    function tirerUnBatonnet() {
      const available = students.filter(s => !s.picked && !s.absent);
      if (available.length === 0) {
        alert("Tous les élèves présents sont déjà passés ! Cliquez sur 'Recommencer le pot'.");
        return;
      }

      const btn = document.getElementById("btnDraw");
      btn.disabled = true;

      const drawnWrapper = document.getElementById("drawnStickWrapper");
      const nameEl = document.getElementById("drawnName");
      drawnWrapper.classList.remove("active");

      // Animation de suspense / défilement
      let counter = 0;
      const interval = setInterval(() => {
        const randomTemp = available[Math.floor(Math.random() * available.length)].name;
        nameEl.innerText = randomTemp;
        drawnWrapper.classList.add("active");
        counter++;

        if (counter > 14) {
          clearInterval(interval);
          const chosen = available[Math.floor(Math.random() * available.length)];
          nameEl.innerText = chosen.name;
          chosen.picked = true;
          save();
          render();
          launchConfetti();
          btn.disabled = false;
        }
      }, 70);
    }

    // Mini moteur de confettis autonome
    function launchConfetti() {
      const canvas = document.getElementById("confettiCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ["#facc15", "#38bdf8", "#818cf8", "#f472b6", "#4ade80"];

      for (let i = 0; i < 45; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.7) * 16,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * 360,
          vrot: (Math.random() - 0.5) * 10
        });
      }

      let frames = 0;
      function renderConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35;
          p.rot += p.vrot;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });

        frames++;
        if (frames < 60) {
          requestAnimationFrame(renderConfetti);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      renderConfetti();
    }

    init();
  </script>
</body>
</html>
